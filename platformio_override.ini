; PlatformIO Project Configuration Override
; ------------------------------------------------------------------------------
; Board/build settings for this fork, tracked by git (upstream WLED ignores this
; file; we removed it from .gitignore so the wled_c3p env is versioned).
; PlatformIO merges this file on top of platformio.ini.
;
; WHY THIS FILE EXISTS
;   platformio.ini ships a long multi-line `default_envs` list whose FIRST entry
;   is `nodemcuv2` (ESP8266). PlatformIO generates .vscode/c_cpp_properties.json
;   from that first entry only, so IntelliSense was configured for ESP8266
;   (xtensa-lx106 compiler, framework-arduinoespressif8266 include paths,
;   ARDUINO_ARCH_ESP8266 defines) while the code being edited targets ESP32-C3.
;
;   Pinning default_envs here makes the generated IntelliSense config match the
;   environment we actually build.
;
; AFTER CHANGING THIS FILE
;   Delete .vscode/c_cpp_properties.json and reopen the project (or run
;   `pio run`) so PlatformIO regenerates it for the new environment.
; ------------------------------------------------------------------------------

[platformio]
; First entry drives IntelliSense. Add more (comma-separated) if you flash
; several boards, but keep the one you edit most in front.
default_envs = wled_c3p
; Add `, esp32c3dev_qio` above if you still flash the stock C3 devkit.

; ------------------------------------------------------------------------------
; Add local build tweaks below as needed.
; See platformio_override.sample.ini for the full list of options, e.g.:
;
; [env:esp32c3dev_custom]
; extends = env:esp32c3dev_qio
; build_flags = ${env:esp32c3dev_qio.build_flags}
;   -D WLED_RELEASE_NAME=\"ESP32-C3-QIO_custom\"
;   -D WLED_DISABLE_2D
; custom_usermods = ${env:esp32c3dev_qio.custom_usermods} Temperature
; ------------------------------------------------------------------------------

; ------------------------------------------------------------------------------
; wled_c3p - custom ESP32-C3 board
;
;   WS2812x data : GPIO2   (this is also the built-in default LED pin for -C3)
;   Relay        : GPIO1
;   Button       : GPIO9   (wired to GND, BTNTYPE defaults to a push button)
;   I2S mic      : BCLK/SCK GPIO4, LRCL/WS GPIO5, DOUT/SD GPIO3 (no master clock)
;
; Note: GPIO2 and GPIO9 are ESP32-C3 strapping pins. GPIO9 is the BOOT/download
; pin, so holding the button while the board resets puts it into download mode.
; ------------------------------------------------------------------------------
[env:wled_c3p]
extends = env:esp32c3dev_qio
;; note: build_flags of the extended env are NOT inherited automatically,
;; they must be referenced explicitly (same reason as in platformio.ini)
build_unflags = ${env:esp32c3dev_qio.build_unflags} -D WLED_RELEASE_NAME=\"ESP32-C3-QIO\"
build_flags = ${env:esp32c3dev_qio.build_flags} -D WLED_RELEASE_NAME=\"c3p\"
  -D DATA_PINS=2     ;; WS2812x data output
  -D RLYPIN=1        ;; relay; RLYMDE defaults to 1 (active high), set -D RLYMDE=0 for active low
  -D BTNPIN=9        ;; push button to GND
  ;; I2S microphone (audioreactive usermod, inherited from esp32c3dev_qio).
  ;; SR_DMTYPE=1 is the default, listed here to make the wiring explicit.
  ;; Add -D UM_AUDIOREACTIVE_ENABLE to have the usermod enabled on a fresh device.
  -D UM_AUDIOREACTIVE_ENABLE
  -D SR_DMTYPE=1     ;; 1 = generic I2S microphone without master clock
  -D I2S_CKPIN=4     ;; mic SCK / BCLK
  -D I2S_WSPIN=5     ;; mic WS / LRCL
  -D I2S_SDPIN=3     ;; mic SD / DOUT (AUDIOPIN stays -1, i.e. analog input disabled)
  ;; Debug logging (-D WLED_DEBUG) is off, and that is a display decision as much as a
  ;; log-volume one: the flag enables the DEBUG_PRINT* macros on Serial = USB CDC, and
  ;; wled.cpp pairs it with a `delay(2500)` so the CDC can enumerate before the first
  ;; line is written. That delay sits *before* UsermodManager::setup(), so while it runs
  ;; the panel is blank - it is 2.5 s of the ~5 s this board takes to light up.
  ;; Turn it back on when you need the boot log (it is what makes the ST7735 usermod's
  ;; DEBUG_PRINT* lines visible), and expect the screen to come up that much later.
  ;-D WLED_DEBUG

  ;; 0.96" ST7735 80x160 SPI TFT (usermods/ST7735_display).
  ;; TFT_eSPI is configured entirely at build time - these values are compiled into
  ;; the library, so the pin list on the usermod settings page is read-only.
  ;; Tab variant: the module's own example addresses columns 24..103 and rows 0..159
  ;; (CASET 0x0018..0x0067, RASET 0x0000..0x009F), which is TFT_eSPI's REDTAB160x80
  ;; (colstart 24, rowstart 0) - not the GREENTAB160x80 default (26/1). The green tab
  ;; also sends INVON, which the vendor's sequence never does. Swapped red/blue is a
  ;; different knob - uncomment TFT_RGB_ORDER below.
  ;; TFT_WIDTH/HEIGHT are portrait, as TFT_eSPI expects. CGRAM_OFFSET is set
  ;; automatically by the tab, so it is deliberately absent.
  ;; SPI stays at 27 MHz: TFT_eSPI warns ST7735 panels misbehave above that.
  -D USER_SETUP_LOADED=1
  -D ST7735_DRIVER=1
  -D ST7735_REDTAB160x80=1
  ;-D TFT_RGB_ORDER=TFT_BGR  ;; uncomment if red and blue are swapped
  -D TFT_WIDTH=80
  -D TFT_HEIGHT=160
  -D TFT_SCLK=7
  -D TFT_MOSI=6
  -D TFT_DC=0
  -D TFT_CS=8
  -D TFT_BL=-1
  ;; The module's RES is wired to GPIO20, which is U0RXD on the C3 - so this gives up
  ;; serial *input* only; TX (GPIO21) keeps working, because arduino-esp32's
  ;; _uartDetachBus_RX leaves the driver alone while the TX pin is still attached.
  ;;
  ;; It is also why the panel shows nothing at all until tft.init() runs: wled.cpp pulls
  ;; GPIO20 down to quiet a floating UART RX (wled.cpp:395) and never releases it, so the
  ;; panel spends the whole boot held in reset. Whether or not that was the reason for
  ;; the pin choice, it is the behaviour this usermod wants - see the first-frame note in
  ;; usermods/ST7735_display/ST7735_display.cpp.
  -D TFT_RST=20
  -D TFT_MISO=-1    ;; ST7735 panels are write-only
  -D LOAD_GLCD=1
  -D SPI_FREQUENCY=27000000

;; custom_usermods is a whole-line list, so the inherited audioreactive entry has to
;; be repeated here - scalar options are replaced, not appended, by `extends`.
;;
;; The order is the order UsermodManager::setup() walks (um_manager.cpp), so it is also
;; the order the boot pays for. AudioReactive waits on its microphone - ~450 ms of
;; `delay()` across audio_reactive.cpp - and while it does, nothing has drawn to the
;; panel yet. Listing the display first puts those waits after the first frame instead
;; of in front of it. The two do not share a pin (display 0/6/7/8/20, mic 3/4/5).
custom_usermods =
  ST7735_display
  ${env:esp32c3dev_qio.custom_usermods}

;; TFT_eSPI 2.5.43 (the version usermods/ST7735_display/library.json pins) cannot
;; drive a display on the ESP32-C3 with arduino-esp32 v3.x: it sends its commands to
;; the flash controller instead of the general purpose SPI, and it aliases MISO onto
;; the MOSI pin so the bus comes up half configured.  Either one leaves the board
;; watchdog-resetting in a loop right after `tft.init()`.  The script below patches
;; both out of the installed header on every build (the header lives in .pio/libdeps
;; and is thrown away by a clean build, so a one-off edit there does not survive).
;; Background: usermods/ST7735_display/readme.md, "the board reboots endlessly".
extra_scripts = ${env:esp32c3dev_qio.extra_scripts}
  pre:pio-scripts/tft_espi_c3_fixes.py

